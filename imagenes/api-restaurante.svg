<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <style>
      .txt-bold { font-family: 'Segoe UI', Tahoma, sans-serif; font-weight: 800; fill: #2C1A4D; }
      .txt-code { font-family: 'Courier New', monospace; font-weight: 700; fill: #2C1A4D; }
    </style>
  </defs>

  <!-- Fondo de la tarjeta -->
  <rect x="2" y="2" width="396" height="246" rx="20" fill="#F5EFFF" stroke="#2C1A4D" stroke-width="3"/>

  <!-- Barra superior estilo ventana/terminal -->
  <path d="M 2 22 Q 2 2 22 2 L 378 2 Q 398 2 398 22 L 398 42 L 2 42 Z" fill="#E2D1F9" stroke="#2C1A4D" stroke-width="3"/>
  <circle cx="22" cy="22" r="5" fill="#FFC6FF" stroke="#2C1A4D" stroke-width="1.5"/>
  <circle cx="38" cy="22" r="5" fill="#BDB2FF" stroke="#2C1A4D" stroke-width="1.5"/>
  <circle cx="54" cy="22" r="5" fill="#A0C4FF" stroke="#2C1A4D" stroke-width="1.5"/>

  <!-- Endpoint en la barra superior -->
  <rect x="110" y="11" width="180" height="22" rx="11" fill="#FFFFFF" stroke="#2C1A4D" stroke-width="1.5"/>
  <text x="200" y="26" class="txt-code" font-size="11" text-anchor="middle">GET /api/v1/menu</text>

  <!-- Píldoras laterales de endpoints (Izquierda) -->
  <g transform="translate(25, 70)">
    <rect width="85" height="30" rx="15" fill="#A0C4FF" stroke="#2C1A4D" stroke-width="2"/>
    <text x="42.5" y="19" class="txt-code" font-size="10" text-anchor="middle">POST /order</text>
  </g>

  <g transform="translate(25, 120)">
    <rect width="85" height="30" rx="15" fill="#FFFFFF" stroke="#2C1A4D" stroke-width="2"/>
    <text x="42.5" y="19" class="txt-code" font-size="10" text-anchor="middle">{ tables }</text>
  </g>

  <!-- Píldoras laterales de respuestas (Derecha) -->
  <g transform="translate(290, 70)">
    <rect width="85" height="30" rx="15" fill="#FFC6FF" stroke="#2C1A4D" stroke-width="2"/>
    <text x="42.5" y="19" class="txt-code" font-size="10" text-anchor="middle">200 OK</text>
  </g>

  <g transform="translate(290, 120)">
    <rect width="85" height="30" rx="15" fill="#FFFFFF" stroke="#2C1A4D" stroke-width="2"/>
    <text x="42.5" y="19" class="txt-code" font-size="10" text-anchor="middle">[ items ]</text>
  </g>

  <!-- Ilustración Central: Campana de Restaurante / Cloche -->
  <!-- Ondas de vapor estilo código -->
  <path d="M 185 85 Q 180 75 185 65" fill="none" stroke="#BDB2FF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 200 82 Q 205 70 200 60" fill="none" stroke="#FFC6FF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 215 85 Q 220 75 215 65" fill="none" stroke="#A0C4FF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Agarradera -->
  <circle cx="200" cy="98" r="8" fill="#FFC6FF" stroke="#2C1A4D" stroke-width="2.5"/>

  <!-- Domo de la campana -->
  <path d="M 135 165 A 65 55 0 0 1 265 165 Z" fill="#E2D1F9" stroke="#2C1A4D" stroke-width="3"/>
  <path d="M 148 165 A 52 45 0 0 1 252 165 Z" fill="#D0BDF4" opacity="0.5"/>

  <!-- Código central en la campana -->
  <rect x="165" y="132" width="70" height="22" rx="6" fill="#FFFFFF" stroke="#2C1A4D" stroke-width="1.5"/>
  <text x="200" y="147" class="txt-code" font-size="12" text-anchor="middle">{ JSON }</text>

  <!-- Plato base -->
  <ellipse cx="200" cy="168" rx="80" ry="12" fill="#FFFFFF" stroke="#2C1A4D" stroke-width="3"/>
  <path d="M 130 168 L 270 168 L 260 178 L 140 178 Z" fill="#BDB2FF" stroke="#2C1A4D" stroke-width="2.5"/>

  <!-- Placa inferior: RESTAURANT API -->
  <rect x="120" y="200" width="160" height="28" rx="14" fill="#BDB2FF" stroke="#2C1A4D" stroke-width="2"/>
  <text x="200" y="218" class="txt-bold" font-size="12" text-anchor="middle" letter-spacing="1">RESTAURANT API</text>
</svg>

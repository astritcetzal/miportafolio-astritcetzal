<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="astrit-avatar">
    <defs>
        <style>
            .personaje {
                animation: flotarPersonaje 4s ease-in-out infinite;
                transform-origin: center bottom;
            }
            @keyframes flotarPersonaje {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-8px); }
            }
            .ojos {
                transform-origin: 100px 102px;
                animation: blinkCute 4s infinite;
            }
            @keyframes blinkCute {
                0%, 90%, 100% { transform: scaleY(1); }
                95% { transform: scaleY(0.1); }
            }
        </style>
        <pattern id="cuadricula" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="0" y2="4" stroke="#D32F2F" stroke-width="0.6" opacity="0.4"/>
            <line x1="0" y1="0" x2="4" y2="0" stroke="#D32F2F" stroke-width="0.6" opacity="0.4"/>
        </pattern>
    </defs>

    <!-- Flores / Estrellas decorativas de fondo -->
    <g transform="translate(30, 40)">
        <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
            <ellipse rx="7" ry="3" fill="#FFC4D9" transform="rotate(0)"/>
            <ellipse rx="7" ry="3" fill="#FFC4D9" transform="rotate(72)"/>
            <ellipse rx="7" ry="3" fill="#FFC4D9" transform="rotate(144)"/>
            <ellipse rx="7" ry="3" fill="#FFC4D9" transform="rotate(216)"/>
            <ellipse rx="7" ry="3" fill="#FFC4D9" transform="rotate(288)"/>
            <circle r="3" fill="#FFFFFF"/>
        </g>
    </g>

    <g transform="translate(170, 60)">
        <g>
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
            <ellipse rx="6" ry="2.5" fill="#E2D1F9" transform="rotate(0)"/>
            <ellipse rx="6" ry="2.5" fill="#E2D1F9" transform="rotate(72)"/>
            <ellipse rx="6" ry="2.5" fill="#E2D1F9" transform="rotate(144)"/>
            <ellipse rx="6" ry="2.5" fill="#E2D1F9" transform="rotate(216)"/>
            <ellipse rx="6" ry="2.5" fill="#E2D1F9" transform="rotate(288)"/>
            <circle r="2.5" fill="#FFFFFF"/>
        </g>
    </g>

    <g transform="translate(40, 160)">
        <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
            <ellipse rx="5" ry="2" fill="#AEC6CF" transform="rotate(0)"/>
            <ellipse rx="5" ry="2" fill="#AEC6CF" transform="rotate(72)"/>
            <ellipse rx="5" ry="2" fill="#AEC6CF" transform="rotate(144)"/>
            <ellipse rx="5" ry="2" fill="#AEC6CF" transform="rotate(216)"/>
            <ellipse rx="5" ry="2" fill="#AEC6CF" transform="rotate(288)"/>
            <circle r="2" fill="#FFFFFF"/>
        </g>
    </g>

    <!-- Personaje -->
    <g class="personaje">
        <path d="M 40 100 C 35 70 50 40 100 35 C 150 40 165 70 160 100 L 160 140 C 160 155 145 160 130 160 L 70 160 C 55 160 40 155 40 140 Z" fill="#1A1A1A"/>
        <rect x="90" y="130" width="20" height="30" fill="#BE8B5E"/>
        <path d="M 30 200 C 30 150 170 150 170 200 Z" fill="#2C1A4D"/>
        <path d="M 50 200 L 100 155 L 150 200 Z" fill="#4B367C"/>
        <path d="M 85 200 L 100 155 L 115 200 Z" fill="#FFFFFF"/>
        <circle cx="100" cy="105" r="42" fill="#D8AA8A"/>
        <path d="M 58 105 C 58 60 85 55 98 60 C 85 75 75 80 58 105 Z" fill="#1A1A1A"/>
        <path d="M 142 105 C 142 60 115 55 102 60 C 115 75 125 80 142 105 Z" fill="#1A1A1A"/>
        <path d="M 97 110 Q 100 114 103 110" stroke="#B88A6A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M 88 130 Q 100 138 112 130" stroke="#3E2723" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        
        <!-- Ojos -->
        <g class="ojos">
            <ellipse cx="80" cy="102" rx="6" ry="8" fill="#3E2723"/>
            <circle cx="78" cy="99" r="2" fill="#FFFFFF"/>
            <circle cx="82" cy="105" r="1" fill="#FFFFFF"/>
            <path d="M 74 95 Q 72 93 70 91" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <path d="M 86 95 Q 88 93 90 91" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <ellipse cx="120" cy="102" rx="6" ry="8" fill="#3E2723"/>
            <circle cx="118" cy="99" r="2" fill="#FFFFFF"/>
            <circle cx="122" cy="105" r="1" fill="#FFFFFF"/>
            <path d="M 114 95 Q 112 93 110 91" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <path d="M 126 95 Q 128 93 130 91" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </g>
    </g>
</svg>
